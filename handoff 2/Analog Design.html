<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analog — Screen Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: #1A1D2E; }
  body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px 80px;
    width: 100%;
    gap: 56px;
  }

  .stage-header {
    text-align: center;
    color: #fff;
    gap: 8px;
    display: flex;
    flex-direction: column;
  }
  .stage-header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .stage-header p { font-size: 15px; color: rgba(255,255,255,0.5); }

  .screen-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 48px 32px;
    justify-content: center;
    width: 100%;
    max-width: 1400px;
  }

  .screen-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .screen-label {
    color: rgba(255,255,255,0.45);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .screen-section-title {
    width: 100%;
    max-width: 1400px;
    color: rgba(255,255,255,0.3);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding-bottom: 0;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    padding-bottom: 12px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── Design tokens ───────────────────────────────────────────────────────────
const T = {
  bg:         '#F2F3F7',
  surface:    '#FFFFFF',
  surfaceMid: '#EDEEF3',
  surfaceMuted:'#E4E5EC',
  sep:        '#E0E2EA',
  textPri:    '#1A1D2E',
  textSec:    '#6B6F82',
  textTer:    '#9EA2B3',
  accent:     '#D4943A',
  accentSoft: '#F5EAD8',
  accentDeep: '#B97A28',
  bubble:     '#DDD5F3',
  bubbleSend: '#DDD5F3',
  badge:      '#7B6CB7',
  badgeSoft:  '#EDE9F8',
  online:     '#4F8A5B',
  onlineSoft: '#E3F0E7',
  destruct:   '#B5473E',
  destructSoft:'#F5E5E4',
  navBg:      'rgba(242,243,247,0.92)',
};

// ─── Shared atoms ─────────────────────────────────────────────────────────────

function Avatar({ name='', size=44, color=T.accent, mediaId=null, online=false }) {
  const initials = name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase() || '?';
  const colors = [T.accent,'#7B6CB7','#4F8A5B','#B5473E','#4A7FA5','#C07850'];
  const c = mediaId ? T.accent : colors[name.charCodeAt(0)%colors.length] || T.accent;
  return (
    <div style={{position:'relative',display:'inline-block',flexShrink:0}}>
      <div style={{
        width:size,height:size,borderRadius:'50%',
        background:`linear-gradient(135deg, ${c}dd, ${c}99)`,
        display:'flex',alignItems:'center',justifyContent:'center',
        color:'#fff',fontSize:size*0.36,fontWeight:700,
        fontFamily:'DM Sans,sans-serif',letterSpacing:-0.3,
        boxShadow:`0 2px 8px ${c}44`,
        flexShrink:0,
      }}>
        {initials}
      </div>
      {online && (
        <div style={{
          position:'absolute',bottom:1,right:1,
          width:size*0.26,height:size*0.26,
          borderRadius:'50%',background:T.online,
          border:'2px solid #fff',
        }}/>
      )}
    </div>
  );
}

function Badge({ count }) {
  if (!count) return null;
  const label = count > 99 ? '99+' : String(count);
  return (
    <div style={{
      background:T.badge,color:'#fff',
      fontSize:11,fontWeight:700,
      borderRadius:999,minWidth:20,height:20,
      padding:'0 6px',display:'flex',alignItems:'center',justifyContent:'center',
      letterSpacing:-0.2,flexShrink:0,
    }}>
      {label}
    </div>
  );
}

function Pill({ label, active=false, onPress }) {
  return (
    <button onClick={onPress} style={{
      padding:'7px 14px',borderRadius:999,border:'none',cursor:'pointer',
      background: active ? T.accent : T.surfaceMuted,
      color: active ? '#fff' : T.textSec,
      fontSize:13,fontWeight:600,transition:'all .15s',
      fontFamily:'DM Sans,sans-serif',
    }}>{label}</button>
  );
}

function IosSection({ title, children, style={} }) {
  return (
    <div style={{marginBottom:20,...style}}>
      {title && <div style={{
        fontSize:11,fontWeight:700,color:T.textTer,
        textTransform:'uppercase',letterSpacing:1,
        paddingLeft:18,paddingBottom:7,
      }}>{title}</div>}
      <div style={{
        background:T.surface,
        borderRadius:14,
        overflow:'hidden',
        marginHorizontal:0,
      }}>
        {children}
      </div>
    </div>
  );
}

function SettingsRow({ icon, label, value, chevron=true, tint=T.accent, onPress, danger=false, last=false }) {
  const [pressed,setPressed]=useState(false);
  return (
    <div
      onClick={onPress}
      onMouseDown={()=>setPressed(true)}
      onMouseUp={()=>setPressed(false)}
      onMouseLeave={()=>setPressed(false)}
      style={{
        display:'flex',alignItems:'center',gap:12,
        padding:'12px 16px',cursor:'pointer',
        background:pressed?'#f0f1f6':T.surface,
        transition:'background .1s',
        borderBottom: last ? 'none' : `1px solid ${T.sep}`,
      }}>
      <div style={{
        width:32,height:32,borderRadius:9,
        background: danger ? T.destructSoft : `${tint}22`,
        display:'flex',alignItems:'center',justifyContent:'center',
        fontSize:17,flexShrink:0,
      }}>{icon}</div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:16,color:danger?T.destruct:T.textPri,fontWeight:500}}>{label}</div>
        {value && <div style={{fontSize:13,color:T.textTer,marginTop:1}}>{value}</div>}
      </div>
      {chevron && <div style={{color:T.textTer,fontSize:14}}>›</div>}
    </div>
  );
}

function Input({ label, value, onChange, placeholder, type='text', multiline=false }) {
  return (
    <div style={{marginBottom:14}}>
      {label && <div style={{fontSize:12,fontWeight:700,color:T.textTer,textTransform:'uppercase',letterSpacing:0.8,marginBottom:7}}>{label}</div>}
      {multiline ? (
        <textarea
          value={value} onChange={e=>onChange(e.target.value)}
          placeholder={placeholder}
          rows={3}
          style={{
            width:'100%',background:T.surfaceMid,border:'none',borderRadius:12,
            padding:'13px 14px',fontSize:16,color:T.textPri,
            fontFamily:'DM Sans,sans-serif',resize:'none',outline:'none',
            '::placeholder':{color:T.textTer},
          }}
        />
      ) : (
        <input
          type={type} value={value} onChange={e=>onChange(e.target.value)}
          placeholder={placeholder}
          style={{
            width:'100%',background:T.surfaceMid,border:'none',borderRadius:12,
            padding:'13px 14px',fontSize:16,color:T.textPri,
            fontFamily:'DM Sans,sans-serif',outline:'none',
          }}
        />
      )}
    </div>
  );
}

function PrimaryButton({ label, onPress, disabled=false, loading=false }) {
  const [pressed,setPressed]=useState(false);
  return (
    <button
      onClick={disabled?undefined:onPress}
      onMouseDown={()=>!disabled&&setPressed(true)}
      onMouseUp={()=>setPressed(false)}
      onMouseLeave={()=>setPressed(false)}
      style={{
        width:'100%',padding:'15px',borderRadius:14,border:'none',cursor:disabled?'default':'pointer',
        background: disabled ? T.surfaceMuted : pressed ? T.accentDeep : T.accent,
        color: disabled ? T.textTer : '#fff',
        fontSize:16,fontWeight:700,letterSpacing:-0.1,
        fontFamily:'DM Sans,sans-serif',transition:'all .15s',
        boxShadow: disabled ? 'none' : pressed ? 'none' : `0 4px 16px ${T.accent}44`,
      }}>
      {loading ? '…' : label}
    </button>
  );
}

// ─── SCREEN: Splash ───────────────────────────────────────────────────────────
function SplashScreen({ navigate }) {
  return (
    <div style={{
      flex:1,display:'flex',flexDirection:'column',
      alignItems:'center',justifyContent:'center',
      background:`linear-gradient(160deg, #1A1D2E 0%, #2C2340 100%)`,
      padding:'40px 32px',gap:0,
    }}>
      {/* Logo mark */}
      <div style={{
        width:96,height:96,borderRadius:28,
        background:`linear-gradient(135deg, ${T.accent} 0%, ${T.accentDeep} 100%)`,
        display:'flex',alignItems:'center',justifyContent:'center',
        boxShadow:`0 12px 40px ${T.accent}55`,
        marginBottom:24,
      }}>
        <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
          <path d="M10 36 L26 10 L42 36" stroke="white" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
          <path d="M16 28 L36 28" stroke="white" strokeWidth="3.5" strokeLinecap="round"/>
          <circle cx="26" cy="42" r="4" fill="white"/>
        </svg>
      </div>
      <div style={{fontSize:32,fontWeight:800,color:'#fff',letterSpacing:-1,marginBottom:8}}>Analog</div>
      <div style={{fontSize:15,color:'rgba(255,255,255,0.45)',marginBottom:56,textAlign:'center',lineHeight:1.5}}>
        Private messaging, reimagined
      </div>
      <div style={{width:'100%',display:'flex',flexDirection:'column',gap:12}}>
        <button onClick={()=>navigate('phone')} style={{
          padding:'15px',borderRadius:14,border:'none',cursor:'pointer',
          background:`linear-gradient(135deg, ${T.accent}, ${T.accentDeep})`,
          color:'#fff',fontSize:16,fontWeight:700,
          fontFamily:'DM Sans,sans-serif',
          boxShadow:`0 6px 24px ${T.accent}55`,
        }}>Get Started</button>
        <button onClick={()=>navigate('phone')} style={{
          padding:'15px',borderRadius:14,border:'none',cursor:'pointer',
          background:'rgba(255,255,255,0.1)',
          color:'rgba(255,255,255,0.8)',fontSize:16,fontWeight:600,
          fontFamily:'DM Sans,sans-serif',backdropFilter:'blur(8px)',
        }}>Sign In</button>
      </div>
      <div style={{marginTop:32,fontSize:12,color:'rgba(255,255,255,0.25)',textAlign:'center',lineHeight:1.6}}>
        End-to-end encrypted · Open protocol<br/>Your messages belong to you
      </div>
    </div>
  );
}

// ─── SCREEN: Phone Entry ──────────────────────────────────────────────────────
function PhoneScreen({ navigate }) {
  const [phone,setPhone]=useState('');
  const [country,setCountry]=useState({flag:'🇺🇸',name:'United States',code:'+1'});
  const [showPicker,setShowPicker]=useState(false);
  const countries=[
    {flag:'🇺🇸',name:'United States',code:'+1'},
    {flag:'🇷🇺',name:'Russia',code:'+7'},
    {flag:'🇩🇪',name:'Germany',code:'+49'},
    {flag:'🇬🇧',name:'United Kingdom',code:'+44'},
    {flag:'🇫🇷',name:'France',code:'+33'},
    {flag:'🇯🇵',name:'Japan',code:'+81'},
    {flag:'🇨🇳',name:'China',code:'+86'},
    {flag:'🇮🇳',name:'India',code:'+91'},
    {flag:'🇧🇷',name:'Brazil',code:'+55'},
    {flag:'🇺🇦',name:'Ukraine',code:'+380'},
  ];
  const valid = phone.length >= 7;
  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',background:T.bg,position:'relative'}}>
      {/* Header */}
      <div style={{padding:'16px 20px 0',display:'flex',alignItems:'center',gap:12}}>
        <button onClick={()=>navigate('splash')} style={{background:'none',border:'none',cursor:'pointer',padding:4,color:T.accent,fontSize:16,fontFamily:'DM Sans,sans-serif',fontWeight:600}}>← Back</button>
      </div>
      <div style={{padding:'28px 20px 0'}}>
        <div style={{width:52,height:52,borderRadius:15,background:T.accentSoft,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:16,fontSize:26}}>📱</div>
        <div style={{fontSize:26,fontWeight:800,color:T.textPri,letterSpacing:-0.8,marginBottom:8}}>Your number</div>
        <div style={{fontSize:15,color:T.textSec,lineHeight:1.5,marginBottom:28}}>We'll send a verification code to confirm your identity.</div>
      </div>
      <div style={{flex:1,padding:'0 20px',overflowY:'auto'}}>
        {/* Country selector */}
        <div style={{marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:700,color:T.textTer,textTransform:'uppercase',letterSpacing:0.8,marginBottom:7}}>Country</div>
          <button onClick={()=>setShowPicker(true)} style={{
            width:'100%',background:T.surface,border:'none',borderRadius:14,
            padding:'14px 16px',display:'flex',alignItems:'center',gap:12,cursor:'pointer',
            boxShadow:`0 1px 4px rgba(0,0,0,0.06)`,
          }}>
            <span style={{fontSize:24}}>{country.flag}</span>
            <span style={{flex:1,textAlign:'left',fontSize:16,color:T.textPri,fontWeight:500,fontFamily:'DM Sans,sans-serif'}}>{country.name}</span>
            <span style={{color:T.accent,fontWeight:700,fontSize:15,fontFamily:'DM Sans,sans-serif'}}>{country.code}</span>
            <span style={{color:T.textTer,fontSize:14}}>›</span>
          </button>
        </div>
        {/* Phone input */}
        <div style={{marginBottom:20}}>
          <div style={{fontSize:11,fontWeight:700,color:T.textTer,textTransform:'uppercase',letterSpacing:0.8,marginBottom:7}}>Phone Number</div>
          <div style={{display:'flex',gap:10}}>
            <div style={{
              background:T.surface,borderRadius:12,padding:'0 14px',
              display:'flex',alignItems:'center',
              color:T.accent,fontWeight:700,fontSize:17,minWidth:60,
              boxShadow:`0 1px 4px rgba(0,0,0,0.06)`,
            }}>{country.code}</div>
            <input
              type="tel" value={phone} onChange={e=>setPhone(e.target.value)}
              placeholder="(555) 123-4567"
              style={{
                flex:1,background:T.surface,border:'none',borderRadius:12,
                padding:'14px 14px',fontSize:18,fontWeight:500,
                color:T.textPri,fontFamily:'DM Sans,sans-serif',outline:'none',
                boxShadow:`0 1px 4px rgba(0,0,0,0.06)`,
              }}
            />
          </div>
        </div>
        {/* Preview */}
        {phone.length>0 && (
          <div style={{
            background:T.accentSoft,borderRadius:14,padding:'12px 16px',
            marginBottom:24,border:`1px solid ${T.accent}33`,
          }}>
            <div style={{fontSize:12,color:T.accent,fontWeight:700,textTransform:'uppercase',letterSpacing:0.6,marginBottom:4}}>Full number</div>
            <div style={{fontSize:20,fontWeight:700,color:T.textPri,fontFamily:'DM Mono,monospace'}}>{country.code} {phone}</div>
          </div>
        )}
        <PrimaryButton label="Send Code" onPress={()=>navigate('otp')} disabled={!valid} />
      </div>
      {/* Country picker sheet */}
      {showPicker && (
        <div style={{position:'absolute',inset:0,background:'rgba(26,29,46,0.5)',display:'flex',flexDirection:'column',justifyContent:'flex-end',zIndex:100}}>
          <div style={{background:T.surface,borderTopLeftRadius:24,borderTopRightRadius:24,maxHeight:'65%',display:'flex',flexDirection:'column'}}>
            <div style={{width:40,height:4,borderRadius:999,background:T.sep,alignSelf:'center',marginTop:10,marginBottom:12}}/>
            <div style={{padding:'0 18px 12px',fontSize:19,fontWeight:700,color:T.textPri,borderBottom:`1px solid ${T.sep}`,marginBottom:8}}>Select Country</div>
            <div style={{overflowY:'auto',paddingBottom:20}}>
              {countries.map(c=>(
                <button key={c.code} onClick={()=>{setCountry(c);setShowPicker(false);}} style={{
                  width:'100%',background:'none',border:'none',cursor:'pointer',
                  padding:'13px 18px',display:'flex',alignItems:'center',gap:12,
                  borderBottom:`1px solid ${T.sep}`,
                }}>
                  <span style={{fontSize:24}}>{c.flag}</span>
                  <span style={{flex:1,textAlign:'left',fontSize:16,color:T.textPri,fontWeight:500,fontFamily:'DM Sans,sans-serif'}}>{c.name}</span>
                  <span style={{color:T.accent,fontWeight:700,fontFamily:'DM Sans,sans-serif'}}>{c.code}</span>
                </button>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── SCREEN: OTP ─────────────────────────────────────────────────────────────
function OtpScreen({ navigate }) {
  const [code,setCode]=useState(['','','','','','']);
  const [timer,setTimer]=useState(29);
  const [status,setStatus]=useState('idle'); // idle | verifying | error
  const inputRefs = Array.from({length:6},()=>useRef(null));

  useEffect(()=>{
    const t = setInterval(()=>setTimer(s=>Math.max(0,s-1)),1000);
    return ()=>clearInterval(t);
  },[]);

  function handleInput(i, val) {
    const digits = val.replace(/\D/g,'');
    if (digits.length>1) {
      // paste
      const next=[...code];
      for(let j=0;j<6&&j<digits.length;j++) next[i+j]=digits[j]||'';
      setCode(next.slice(0,6));
      const focusIdx=Math.min(i+digits.length,5);
      inputRefs[focusIdx]?.current?.focus();
      return;
    }
    const next=[...code]; next[i]=digits;
    setCode(next);
    if(digits&&i<5) inputRefs[i+1]?.current?.focus();
  }

  function handleKeyDown(i,e) {
    if(e.key==='Backspace'&&!code[i]&&i>0) {
      const next=[...code]; next[i-1]=''; setCode(next);
      inputRefs[i-1]?.current?.focus();
    }
  }

  const filled = code.every(d=>d!=='');
  const formatted = `${String(Math.floor(timer/60)).padStart(2,'0')}:${String(timer%60).padStart(2,'0')}`;

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',background:T.bg}}>
      <div style={{padding:'16px 20px 0',display:'flex',alignItems:'center'}}>
        <button onClick={()=>navigate('phone')} style={{background:'none',border:'none',cursor:'pointer',padding:4,color:T.accent,fontSize:16,fontFamily:'DM Sans,sans-serif',fontWeight:600}}>← Back</button>
      </div>
      <div style={{padding:'28px 20px 0'}}>
        <div style={{width:52,height:52,borderRadius:15,background:T.badgeSoft,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:16,fontSize:26}}>🔐</div>
        <div style={{fontSize:26,fontWeight:800,color:T.textPri,letterSpacing:-0.8,marginBottom:8}}>Verify code</div>
        <div style={{fontSize:15,color:T.textSec,lineHeight:1.5,marginBottom:28}}>Enter the 6-digit code sent to <strong style={{color:T.textPri}}>+1 (555) 000-0000</strong></div>
      </div>
      <div style={{flex:1,padding:'0 20px'}}>
        {/* Code cells */}
        <div style={{display:'flex',gap:8,marginBottom:16}}>
          {code.map((digit,i)=>(
            <div key={i} style={{position:'relative',flex:1}}>
              <input
                ref={inputRefs[i]}
                type="tel" maxLength={6}
                value={digit}
                onChange={e=>handleInput(i,e.target.value)}
                onKeyDown={e=>handleKeyDown(i,e)}
                style={{
                  width:'100%',textAlign:'center',
                  background: digit ? T.accentSoft : T.surface,
                  border: digit ? `2px solid ${T.accent}` : `2px solid ${T.sep}`,
                  borderRadius:14,padding:'14px 4px',
                  fontSize:24,fontWeight:800,color:T.textPri,
                  fontFamily:'DM Mono,monospace',outline:'none',
                  transition:'all .15s',
                }}
              />
            </div>
          ))}
        </div>
        {/* Timer */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,marginBottom:24}}>
          <div style={{
            width:28,height:28,borderRadius:'50%',
            background: timer>0 ? T.accentSoft : T.surfaceMuted,
            display:'flex',alignItems:'center',justifyContent:'center',
            fontSize:11,fontWeight:700,
            color: timer>0 ? T.accent : T.textTer,
            fontFamily:'DM Mono,monospace',
          }}>{timer>0?formatted:'✓'}</div>
          {timer>0 ? (
            <span style={{fontSize:14,color:T.textSec}}>Code expires in <strong style={{color:T.accent,fontFamily:'DM Mono,monospace'}}>{formatted}</strong></span>
          ) : (
            <button style={{fontSize:14,color:T.accent,fontWeight:600,background:'none',border:'none',cursor:'pointer',fontFamily:'DM Sans,sans-serif'}}>Resend code →</button>
          )}
        </div>
        <PrimaryButton label={status==='verifying'?'Verifying…':'Verify'} onPress={()=>navigate('profilesetup')} disabled={!filled} loading={status==='verifying'} />
        <button onClick={()=>navigate('phone')} style={{
          width:'100%',marginTop:12,padding:'12px',borderRadius:14,border:'none',
          cursor:'pointer',background:'none',color:T.textSec,fontSize:15,fontWeight:500,
          fontFamily:'DM Sans,sans-serif',
        }}>Wrong number? Change it</button>
      </div>
    </div>
  );
}

// ─── SCREEN: Profile Setup ────────────────────────────────────────────────────
function ProfileSetupScreen({ navigate }) {
  const [firstName,setFirstName]=useState('');
  const [lastName,setLastName]=useState('');

// ─── SCREEN: Active Call ──────────────────────────────────────────────────────
function CallScreen({ navigate, params={} }) {
  const user = params.user || {name:'Sarah Kim'};
  const [elapsed,setElapsed]=useState(0);
  const [muted,setMuted]=useState(false);
  const [speaker,setSpeaker]=useState(false);

  useEffect(()=>{
    const t=setInterval(()=>setElapsed(s=>s+1),1000);
    return ()=>clearInterval(t);
  },[]);

  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

  return (
    <div style={{
      flex:1,display:'flex',flexDirection:'column',
      background:`linear-gradient(160deg, #1A1D2E 0%, #2C2340 60%, #1a2a1a 100%)`,

      padding:'60px 24px 44px',
    }}>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:16}}>
        <Avatar name={user.name} size={100} />
        <div>
          <div style={{fontSize:28,fontWeight:800,color:'#fff',textAlign:'center',letterSpacing:-0.5}}>{user.name}</div>
          <div style={{fontSize:15,color:'rgba(255,255,255,0.6)',textAlign:'center',marginTop:4}}>
            {elapsed===0?'Calling…':fmt(elapsed)}
          </div>
        </div>
        {/* Waveform */}
        <div style={{display:'flex',alignItems:'center',gap:4,height:32,marginTop:8}}>
          {Array.from({length:24}).map((_,i)=>(
            <div key={i} style={{
              width:3,borderRadius:2,
              background:`rgba(255,255,255,${0.3+Math.random()*0.4})`,
              height: `${20+Math.random()*60}%`,
              transition:'height 0.3s ease',
            }}/>
          ))}
        </div>
      </div>
      {/* Controls */}
      <div style={{width:'100%'}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:20,marginBottom:32}}>
          {[
            {icon:muted?'🔇':'🎤',label:muted?'Unmute':'Mute',onPress:()=>setMuted(m=>!m),active:muted},
            {icon:'📹',label:'Video',onPress:()=>{},active:false},
            {icon:speaker?'🔊':'📢',label:'Speaker',onPress:()=>setSpeaker(s=>!s),active:speaker},
          ].map(btn=>(
            <div key={btn.label} onClick={btn.onPress} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8,cursor:'pointer'}}>
              <div style={{
                width:56,height:56,borderRadius:'50%',
                background:btn.active?T.accent:'rgba(255,255,255,0.12)',
                display:'flex',alignItems:'center',justifyContent:'center',
                fontSize:24,backdropFilter:'blur(8px)',
                boxShadow:btn.active?`0 4px 16px ${T.accent}55`:'none',
                transition:'all .2s',
              }}>{btn.icon}</div>
              <span style={{fontSize:12,color:'rgba(255,255,255,0.6)',fontWeight:500}}>{btn.label}</span>
            </div>
          ))}
        </div>
        {/* End call */}
        <div style={{display:'flex',justifyContent:'center'}}>
          <button onClick={()=>navigate('chat',{chat:user})} style={{
            width:72,height:72,borderRadius:'50%',border:'none',cursor:'pointer',
            background:T.destruct,display:'flex',alignItems:'center',justifyContent:'center',
            fontSize:28,boxShadow:`0 6px 24px ${T.destruct}55`,
          }}>📵</button>
        </div>
      </div>
    </div>
  );
}

// ─── App Shell ────────────────────────────────────────────────────────────────
function AppShell({ initialScreen='chatlist' }) {
  const [screen, setScreen] = useState(initialScreen);
  const [params, setParams] = useState({});
  const [history, setHistory] = useState([]);

  function navigate(to, p={}) {
    if (to === -1) {
      if (history.length > 0) {
        const prev = history[history.length - 1];
        setHistory(h => h.slice(0, -1));
        setScreen(prev.screen);
        setParams(prev.params);
      }
      return;
    }
    setHistory(h => [...h, { screen, params }]);
    setScreen(to);
    setParams(p || {});
  }

  const mainTabs = ['chatlist','contacts','settings'];
  const isMainTab = mainTabs.includes(screen);

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',background:T.bg}}>
      {/* Screen */}
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minHeight:0}}>
        {screen==='splash' && <SplashScreen navigate={navigate} />}
        {screen==='phone' && <PhoneScreen navigate={navigate} />}
        {screen==='otp' && <OtpScreen navigate={navigate} />}
        {screen==='profilesetup' && <ProfileSetupScreen navigate={navigate} />}
        {screen==='chatlist' && <ChatListScreen navigate={navigate} />}
        {screen==='chat' && <MessagesScreen navigate={navigate} params={params} />}
        {screen==='contacts' && <ContactsScreen navigate={navigate} />}
        {screen==='profile' && <ProfileScreen navigate={navigate} params={params} />}
        {screen==='settings' && <SettingsScreen navigate={navigate} />}
        {screen==='editprofile' && <EditProfileScreen navigate={navigate} />}
        {screen==='call' && <CallScreen navigate={navigate} params={params} />}
      </div>
      {/* Tab bar only on main tabs */}
      {isMainTab && <TabBar tab={screen} onTab={(t)=>navigate(t)} />}
    </div>
  );
}
